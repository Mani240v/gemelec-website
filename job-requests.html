<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <title>Job Requests | Gemelec Electrical Services</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css?v=20260730d">
  <style>
  body { background: #faf8f3; }
  .dash-nav { background: #0d0d0d; padding: 20px 0; }
  .dash-nav .container { display: flex; align-items: center; justify-content: space-between; }
  .dash-nav-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; color: #fff; }
  .dash-wrap { max-width: 960px; margin: 0 auto; padding: 48px 24px; }

  .dash-login { max-width: 420px; margin: 80px auto; background: #fff; border: 1px solid #e6e4dd; border-radius: 16px; padding: 36px; text-align: center; }
  .dash-login h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 24px; margin-bottom: 20px; }
  .dash-login .form-group { text-align: left; margin-bottom: 16px; }

  .job-list { display: flex; flex-direction: column; gap: 20px; }
  /* A left edge coloured by status, so a page of twenty cards is scannable without reading
     any of them. New is the only one that wants attention, so it is the only loud one. */
  .job-card { background: #fff; border: 1px solid #e6e4dd; border-left: 5px solid #cbd5e1; border-radius: 16px; padding: 26px 28px; transition: box-shadow .15s ease; }
  .job-card:hover { box-shadow: 0 2px 14px rgba(20,20,15,.06); }
  .job-card[data-status="new"]    { border-left-color: #f2c200; }
  .job-card[data-status="quoted"] { border-left-color: #2563eb; }
  .job-card[data-status="won"]    { border-left-color: #1d6f52; }
  .job-card[data-status="lost"]   { border-left-color: #cbd5e1; opacity: .72; }
  .job-card[data-status="lost"]:hover { opacity: 1; }

  .dash-counts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; }
  .dash-count { font-size: 13px; color: var(--text-secondary); background: #fff; border: 1px solid #e6e4dd; border-radius: 999px; padding: 5px 14px; }
  .dash-count strong { color: #0d0d0d; font-size: 15px; margin-right: 3px; }
  .dash-count[data-status="new"] { border-color: #f2c200; background: #fffdf0; }
  .job-card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; border-bottom: 1px solid #f0eee7; padding-bottom: 16px; }
  .job-card-head h3 { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 24px; margin: 0; letter-spacing: .01em; }
  .job-status { font: inherit; font-size: 13px; padding: 6px 10px; border: 1.5px solid var(--gray); border-radius: 8px; background: #fff; text-transform: capitalize; }
  .job-card-date { font-size: 13px; color: var(--text-secondary); }
  .job-status { padding: 8px 12px; border: 1.5px solid var(--gray); border-radius: var(--radius); font-size: 13px; font-weight: 600; text-transform: uppercase; }
  .job-meta { font-size: 14px; color: #333; margin-bottom: 4px; }
  .job-meta a { color: var(--teal); }
  .job-description { font-size: 14px; color: #333; line-height: 1.6; background: #faf8f3; border-radius: var(--radius-lg); padding: 14px 16px; margin: 14px 0; }
  .job-photos { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .job-photos a { display: block; width: 120px; height: 120px; border-radius: var(--radius-lg); overflow: hidden; border: 1.5px solid var(--gray); }
  .job-photos img { width: 100%; height: 100%; object-fit: cover; }
  .job-photos-note { font-size: 13px; color: var(--text-secondary); font-style: italic; margin-bottom: 14px; }
  .job-ai-label { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #b45309; background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 4px 10px; display: inline-block; margin-bottom: 10px; }
  /* The summary is now structured rather than one block of text — see renderSummary(). */
  .job-ai-summary { font-size: 14px; color: #333; margin-bottom: 16px; }
  .job-ai-para { margin: 0 0 10px; line-height: 1.65; }
  .job-standing-note { margin: 0 0 12px; font-size: 12px; line-height: 1.5; color: #8a8a83; }
  .job-sub { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-secondary); margin: 16px 0 8px; }
  .job-why { margin: 0 0 12px; padding: 0; list-style: none; }
  .job-why li { position: relative; padding: 8px 12px 8px 14px; margin-bottom: 6px; background: #faf9f5; border-left: 2px solid #e0ddd0; border-radius: 0 6px 6px 0; line-height: 1.55; font-size: 13.5px; }
  .job-why code { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; color: #0d0d0d; background: #efede3; border-radius: 4px; padding: 2px 6px; margin-right: 4px; }
  .job-ai-range { font-size: 14px; font-weight: 600; color: #0d0d0d; margin-bottom: 14px; padding: 10px 14px; background: #fffdf0; border: 1px solid #f4e6a8; border-radius: 8px; }
  .job-ai-range-note { display: block; font-weight: 400; font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
  .job-costing-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 13px; }
  .job-costing-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); padding: 6px 8px; border-bottom: 1.5px solid var(--gray); }
  .job-costing-table td { padding: 6px 8px; border-bottom: 1px solid #f0eee7; vertical-align: middle; }
  .job-costing-table input { width: 100%; padding: 6px 8px; border: 1.5px solid var(--gray); border-radius: 4px; font-size: 13px; }
  .job-costing-table input.qty { width: 60px; }
  .job-costing-table input.price { width: 90px; }
  .job-line-remove { background: none; border: none; color: #991b1b; cursor: pointer; font-size: 13px; }
  .job-flagged { background: #fef2f2; border: 1px solid #fca5a5; border-radius: var(--radius-lg); padding: 10px 14px; font-size: 13px; color: #991b1b; margin-bottom: 14px; }
  .job-flagged ul { margin: 4px 0 0; padding-left: 18px; }
  /* Deliberately not red. .job-flagged is the system speaking about a fault it found;
     .job-notes is routine price-list guidance, and .job-unpriced is the AI's own words,
     which nothing has checked. Three sources, three looks — they used to share one box. */
  .job-notes { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: var(--radius-lg); padding: 10px 14px; font-size: 13px; color: #334155; margin-bottom: 14px; }
  .job-notes ul { margin: 4px 0 0; padding-left: 18px; }
  .job-unpriced { background: #fffbeb; border: 1px dashed #fcd34d; border-radius: var(--radius-lg); padding: 10px 14px; font-size: 13px; color: #78350f; margin-bottom: 14px; }
  .job-unpriced ul { margin: 4px 0 0; padding-left: 18px; }
  .job-total { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 18px; margin: 0 0 6px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; background: #faf9f5; border-radius: 10px; padding: 14px 16px; }
  .job-total-yours { font-size: 26px; }
  /* The list total is the ceiling and the discounted one is what Mani actually charges, so
     the discounted figure is the prominent one. */
  .job-total-rrp { color: var(--text-secondary); font-weight: 500; }
  .job-total-sep { color: var(--text-secondary); font-weight: 400; }
  .job-total-yours { color: #0d0d0d; }
  .job-total-note { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 400; color: var(--text-secondary); }
  .job-line-discounted { font-variant-numeric: tabular-nums; color: var(--text-secondary); white-space: nowrap; }
  /* Pushed to the far right, away from Save. Destructive and irreversible, so it should not
     sit under the thumb that was reaching for the button beside it. */
  .job-delete { margin-left: auto; color: #991b1b; border-color: #f3c9c9; background: #fff; }
  .job-delete:hover:not(:disabled) { background: #fdecea; border-color: #e39c9c; }
  .job-actions { flex-wrap: wrap; }

  .job-desc-box { margin-top: 16px; background: #faf9f5; border: 1px solid #e6e4dd; border-radius: 12px; padding: 16px; }
  .job-desc-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #b45309; margin-bottom: 8px; }
  .job-desc-text { width: 100%; box-sizing: border-box; font: 400 13.5px/1.6 'DM Sans', sans-serif; padding: 14px; border: 1.5px solid var(--gray); border-radius: 8px; background: #fff; resize: vertical; }
  .job-desc-actions { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .job-desc-status { font-size: 13px; color: #1d6f52; }
  .job-desc-pending { font-size: 13px; color: var(--text-secondary); font-style: italic; margin: 14px 0 0; }
  .job-desc-error { font-size: 13px; color: #991b1b; margin: 14px 0 0; }
  .job-confidence { font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; }
  .job-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .job-actions .btn { padding: 10px 18px; font-size: 13px; }
  .job-save-status { font-size: 13px; color: var(--text-secondary); }
  .job-no-costing { font-size: 14px; color: var(--text-secondary); font-style: italic; margin-bottom: 14px; }
  
  /* ── Phone layout (added 2026-09-01) ─────────────────────────────────────
     A six-column table cannot work at 390px: the item and code inputs collapse to about
     one character each, which is what the office was actually looking at on a phone.
     Below 700px each line becomes a stacked block with its column name as a label, so
     nothing is truncated and every field is a real tap target.
     The markup is unchanged — .desc/.code/.qty/.price are still where save and copy look
     for them, so this is presentation only. */
  @media (max-width: 700px) {
    .dash-wrap { padding: 20px 14px 60px; }
    .job-card { padding: 18px 16px; border-radius: 12px; }
    .job-card-head { gap: 8px; }
    .job-card-head h3 { font-size: 21px; flex: 1 1 100%; }
    .job-card-date { font-size: 12px; }
    .job-status { flex: 0 0 auto; }

    .job-costing-table,
    .job-costing-table tbody,
    .job-costing-table tr,
    .job-costing-table td { display: block; width: 100%; box-sizing: border-box; }
    /* The header row has nothing to label once the columns are gone. */
    .job-costing-table thead { display: none; }

    .job-costing-table tr {
      border: 1px solid #e6e4dd;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: #fff;
    }

    .job-costing-table td {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
      border-bottom: 0;
    }
    .job-costing-table td::before {
      content: attr(data-label);
      flex: 0 0 84px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    /* The remove button has no label and should not be indented past one. */
    .job-costing-table td:last-child::before { content: none; }

    .job-costing-table input {
      /* 16px stops iOS zooming the page the moment a price is tapped. */
      font-size: 16px;
      padding: 9px 10px;
    }
    .job-costing-table input.qty,
    .job-costing-table input.price { width: 100%; }

    .job-line-discounted { font-weight: 700; color: #0d0d0d; }
    /* min-height, not padding: padding on a 12px font still came out at 33px, under the
       44px a thumb needs — and this is the control that deletes a priced line. */
    .job-line-remove { width: 100%; min-height: 44px; padding: 9px 0; margin-top: 4px; font-size: 14px; }

    .job-total { font-size: 16px; padding: 12px 14px; }
    .job-total-yours { font-size: 22px; }
    .job-total-note { flex: 1 1 100%; }

    /* Full-width action buttons, and Delete on its own line away from Save. */
    .job-actions { gap: 8px; }
    .job-actions .btn { flex: 1 1 100%; min-height: 44px; }
    .job-delete { margin-left: 0; }

    .job-ai-summary, .job-description { font-size: 14px; }
    .job-why li { font-size: 13px; }
    .job-photos a { width: 88px; height: 88px; }
    .dash-counts { gap: 6px; }
  }
</style>
</head>
<body>

<nav class="dash-nav">
  <div class="container">
    <span class="dash-nav-title">GEMELEC — Job Requests</span>
  </div>
</nav>

<div id="dash-login" class="dash-login">
  <h1>Enter dashboard password</h1>
  <div class="form-group">
    <label for="dash-password">Password</label>
    <input type="password" id="dash-password" autocomplete="current-password">
  </div>
  <div class="form-error" id="dash-login-error" role="alert"></div>
  <button type="button" id="dash-login-btn" class="btn btn-primary" style="width:100%; justify-content:center;">Unlock</button>
</div>

<div id="dash-content" class="dash-wrap" style="display:none;">
  <p class="dash-back"><a href="/tech">&larr; Log a job from site</a></p>
  <div id="dash-counts" class="dash-counts" hidden></div>
  <div class="form-error" id="dash-load-error" role="alert"></div>
  <p id="dash-empty" style="display:none; color: var(--text-secondary);">No job requests yet.</p>
  <div id="job-list" class="job-list"></div>
</div>

<script src="js/job-requests-dashboard.js?v=20260831a"></script>
</body>
</html>
