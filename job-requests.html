<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <title>Job Requests | Gemelec Electrical Services</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css?v=20260730d">
  <style>
  body { background: #faf8f3; }
  .dash-nav { background: #0d0d0d; padding: 20px 0; }
  .dash-nav .container { display: flex; align-items: center; justify-content: space-between; }
  .dash-nav-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; color: #fff; }
  .dash-wrap { max-width: 960px; margin: 0 auto; padding: 48px 24px; }

  .dash-login { max-width: 420px; margin: 80px auto; background: #fff; border: 1px solid #e6e4dd; border-radius: 16px; padding: 36px; text-align: center; }
  .dash-login h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 24px; margin-bottom: 20px; }
  .dash-login .form-group { text-align: left; margin-bottom: 16px; }

  .job-list { display: flex; flex-direction: column; gap: 20px; }
  .job-card { background: #fff; border: 1px solid #e6e4dd; border-radius: 16px; padding: 28px; }
  .job-card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; border-bottom: 1px solid #f0eee7; padding-bottom: 16px; }
  .job-card-head h3 { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; margin: 0; }
  .job-card-date { font-size: 13px; color: var(--text-secondary); }
  .job-status { padding: 8px 12px; border: 1.5px solid var(--gray); border-radius: var(--radius); font-size: 13px; font-weight: 600; text-transform: uppercase; }
  .job-meta { font-size: 14px; color: #333; margin-bottom: 4px; }
  .job-meta a { color: var(--teal); }
  .job-description { font-size: 14px; color: #333; line-height: 1.6; background: #faf8f3; border-radius: var(--radius-lg); padding: 14px 16px; margin: 14px 0; }
  .job-photos { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .job-photos a { display: block; width: 90px; height: 90px; border-radius: var(--radius-lg); overflow: hidden; border: 1.5px solid var(--gray); }
  .job-photos img { width: 100%; height: 100%; object-fit: cover; }
  .job-photos-note { font-size: 13px; color: var(--text-secondary); font-style: italic; margin-bottom: 14px; }
  .job-ai-label { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #b45309; background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 4px 10px; display: inline-block; margin-bottom: 10px; }
  .job-ai-summary { font-size: 14px; color: #333; margin-bottom: 14px; }
  .job-ai-range { font-size: 13px; font-weight: 600; color: #0d0d0d; margin-bottom: 14px; }
  .job-ai-range-note { display: block; font-weight: 400; font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
  .job-costing-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 13px; }
  .job-costing-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); padding: 6px 8px; border-bottom: 1.5px solid var(--gray); }
  .job-costing-table td { padding: 6px 8px; border-bottom: 1px solid #f0eee7; vertical-align: middle; }
  .job-costing-table input { width: 100%; padding: 6px 8px; border: 1.5px solid var(--gray); border-radius: 4px; font-size: 13px; }
  .job-costing-table input.qty { width: 60px; }
  .job-costing-table input.price { width: 90px; }
  .job-line-remove { background: none; border: none; color: #991b1b; cursor: pointer; font-size: 13px; }
  .job-flagged { background: #fef2f2; border: 1px solid #fca5a5; border-radius: var(--radius-lg); padding: 10px 14px; font-size: 13px; color: #991b1b; margin-bottom: 14px; }
  .job-flagged ul { margin: 4px 0 0; padding-left: 18px; }
  /* Deliberately not red. .job-flagged is the system speaking about a fault it found;
     .job-notes is routine price-list guidance, and .job-unpriced is the AI's own words,
     which nothing has checked. Three sources, three looks — they used to share one box. */
  .job-notes { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: var(--radius-lg); padding: 10px 14px; font-size: 13px; color: #334155; margin-bottom: 14px; }
  .job-notes ul { margin: 4px 0 0; padding-left: 18px; }
  .job-unpriced { background: #fffbeb; border: 1px dashed #fcd34d; border-radius: var(--radius-lg); padding: 10px 14px; font-size: 13px; color: #78350f; margin-bottom: 14px; }
  .job-unpriced ul { margin: 4px 0 0; padding-left: 18px; }
  .job-total { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 18px; margin-bottom: 6px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
  /* The list total is the ceiling and the discounted one is what Mani actually charges, so
     the discounted figure is the prominent one. */
  .job-total-rrp { color: var(--text-secondary); font-weight: 500; }
  .job-total-sep { color: var(--text-secondary); font-weight: 400; }
  .job-total-yours { color: #0d0d0d; }
  .job-total-note { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 400; color: var(--text-secondary); }
  .job-line-discounted { font-variant-numeric: tabular-nums; color: var(--text-secondary); white-space: nowrap; }
  .job-confidence { font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; }
  .job-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .job-actions .btn { padding: 10px 18px; font-size: 13px; }
  .job-save-status { font-size: 13px; color: var(--text-secondary); }
  .job-no-costing { font-size: 14px; color: var(--text-secondary); font-style: italic; margin-bottom: 14px; }
  </style>
</head>
<body>

<nav class="dash-nav">
  <div class="container">
    <span class="dash-nav-title">GEMELEC — Job Requests</span>
  </div>
</nav>

<div id="dash-login" class="dash-login">
  <h1>Enter dashboard password</h1>
  <div class="form-group">
    <label for="dash-password">Password</label>
    <input type="password" id="dash-password" autocomplete="current-password">
  </div>
  <div class="form-error" id="dash-login-error" role="alert"></div>
  <button type="button" id="dash-login-btn" class="btn btn-primary" style="width:100%; justify-content:center;">Unlock</button>
</div>

<div id="dash-content" class="dash-wrap" style="display:none;">
  <p class="dash-back"><a href="/tech">&larr; Log a job from site</a></p>
  <div class="form-error" id="dash-load-error" role="alert"></div>
  <p id="dash-empty" style="display:none; color: var(--text-secondary);">No job requests yet.</p>
  <div id="job-list" class="job-list"></div>
</div>

<script src="js/job-requests-dashboard.js?v=20260831a"></script>
</body>
</html>
